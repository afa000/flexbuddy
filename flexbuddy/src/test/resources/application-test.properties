spring.datasource.url=jdbc:h2:mem:flexbuddy;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
# The shared test contexts never attach the alert appender; only the alert tests turn it on.
flexbuddy.alerts.enabled=false
