<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#075c76" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#075c76" media="(prefers-color-scheme: light)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FlexBuddy">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="description" content="FlexBuddy could not complete this request.">
    <title th:text="${status == 404 ? 'Page not found | FlexBuddy' : 'Something went wrong | FlexBuddy'}">Something went wrong | FlexBuddy</title>
    <script>
        document.documentElement.dataset.theme =
            localStorage.getItem('flexbuddy-theme') === 'light' ? 'light' : 'dark';
    </script>
    <style>
        html { background: #02080b; }
        html[data-theme="light"] { background: #ffffff; }
    </style>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">
<main class="auth-layout">
    <article class="auth-card info-card error-card" aria-labelledby="error-title">
        <div class="auth-brand">
            <span class="auth-brand-mark">FB</span>
            <div><strong>FlexBuddy</strong><small>Shift tracker</small></div>
        </div>

        <p class="error-code" th:text="${status == 404 ? 'ERROR 404' : 'ERROR'}">ERROR</p>
        <h1 id="error-title" th:text="${status == 404 ? 'Page not found' : 'Something went wrong'}">Something went wrong</h1>
        <p class="auth-copy" th:if="${status == 404}">The page you requested does not exist or may have moved.</p>
        <p class="auth-copy" th:unless="${status == 404}">FlexBuddy could not complete that request. Your saved data is still available, so you can safely try again.</p>

        <div class="error-actions">
            <a class="primary-button auth-submit info-action" href="/">Return to FlexBuddy</a>
            <a class="secondary-button error-support-link" href="mailto:flexbuddysupport@gmail.com">Contact support</a>
        </div>
    </article>
</main>
</body>
</html>
