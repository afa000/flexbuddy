<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#075c76" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#075c76" media="(prefers-color-scheme: light)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FlexBuddy">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="description" content="Create a FlexBuddy account.">
    <title>Create account | FlexBuddy</title>
    <script>
        document.documentElement.dataset.theme =
            localStorage.getItem('flexbuddy-theme') === 'light' ? 'light' : 'dark';
    </script>
    <style>
        html { background: #02080b; }
        html[data-theme="light"] { background: #ffffff; }
    </style>
    <link rel="stylesheet" th:href="@{/css/styles.css(v=${buildId})}">
</head>
<body class="auth-page">
<main class="auth-layout">
    <section class="auth-card" aria-labelledby="register-title">
        <div class="auth-brand">
            <span class="auth-brand-mark">FB</span>
            <div><strong>FlexBuddy</strong><small>Shift tracker</small></div>
        </div>

        <p class="eyebrow">CREATE YOUR ACCOUNT</p>
        <h1 id="register-title">Start tracking</h1>
        <p class="auth-copy">Your shifts and statistics will belong only to your account.</p>

        <form class="auth-form" th:action="@{/register}" th:object="${registration}" method="post">
            <div class="notice error-notice auth-notice" role="alert" th:if="${#fields.hasGlobalErrors()}">
                <span th:each="message : ${#fields.globalErrors()}" th:text="${message}"></span>
            </div>
            <label class="field">
                <span>Name</span>
                <input th:field="*{displayName}" type="text" autocomplete="name" maxlength="80" required autofocus>
                <small class="field-error" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}"></small>
            </label>
            <label class="field">
                <span>Email</span>
                <input th:field="*{email}" type="email" autocomplete="email" maxlength="254" required>
                <small class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
            </label>
            <label class="field">
                <span>Password</span>
                <input th:field="*{password}" type="password" data-reveal autocomplete="new-password" minlength="8" maxlength="72" required>
                <small class="field-hint">Use at least 8 characters.</small>
                <small class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
            </label>
            <p class="legal-consent">By creating an account, you agree to the <a href="/terms">Terms of Use</a> and acknowledge the <a href="/privacy">Privacy Policy</a>.</p>
            <input id="appDisplayMode" name="app-display-mode" type="hidden" value="browser">
            <button class="primary-button auth-submit" type="submit">Create account</button>
        </form>

        <div class="auth-divider" th:if="${googleEnabled}"><span>or</span></div>
        <a class="secondary-button auth-google" th:if="${googleEnabled}" id="googleSignIn" href="/oauth2/authorization/google">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            <span>Continue with Google</span>
        </a>

        <p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p>
    </section>
</main>
<script th:src="@{/js/password-toggle.js(v=${buildId})}" defer></script>
<script>
    (() => {
        const standalone = window.matchMedia('(display-mode: standalone)').matches
            || window.navigator.standalone === true;
        document.querySelector('#appDisplayMode').value = standalone ? 'standalone' : 'browser';
        const google = document.querySelector('#googleSignIn');
        if (google) {
            google.addEventListener('click', event => {
                event.preventDefault();
                window.location.assign(google.getAttribute('href') + (standalone ? '?remember=1' : ''));
            });
        }
    })();
</script>
</body>
</html>
