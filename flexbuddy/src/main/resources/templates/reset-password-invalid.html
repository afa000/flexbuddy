<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#075c76" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#075c76" media="(prefers-color-scheme: light)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FlexBuddy">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="This password reset link has expired.">
    <title>Link expired | FlexBuddy</title>
    <script>
        document.documentElement.dataset.theme =
            localStorage.getItem('flexbuddy-theme') === 'light' ? 'light' : 'dark';
    </script>
    <style>
        html { background: #02080b; }
        html[data-theme="light"] { background: #ffffff; }
    </style>
    <link rel="stylesheet" th:href="@{/css/styles.css(v=${buildId})}">
</head>
<body class="auth-page">
<main class="auth-layout">
    <section class="auth-card" aria-labelledby="invalid-title">
        <div class="auth-brand">
            <span class="auth-brand-mark">FB</span>
            <div><strong>FlexBuddy</strong><small>Shift tracker</small></div>
        </div>

        <p class="eyebrow">RESET YOUR PASSWORD</p>
        <h1 id="invalid-title">This link has expired</h1>
        <p class="auth-copy" role="alert">This link has expired or was already used. Links work once and last 30 minutes.</p>
        <a class="primary-button auth-submit" href="/forgot-password">Send a new link</a>
        <p class="auth-switch"><a class="text-link" href="/login">Back to sign in</a></p>
    </section>
</main>
</body>
</html>
