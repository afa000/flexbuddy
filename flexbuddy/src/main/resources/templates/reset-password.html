<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#075c76" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#075c76" media="(prefers-color-scheme: light)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FlexBuddy">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="Choose a new FlexBuddy password.">
    <title>Choose a new password | FlexBuddy</title>
    <script>
        document.documentElement.dataset.theme =
            localStorage.getItem('flexbuddy-theme') === 'light' ? 'light' : 'dark';
    </script>
    <style>
        html { background: #02080b; }
        html[data-theme="light"] { background: #ffffff; }
    </style>
    <link rel="stylesheet" th:href="@{/css/styles.css(v=${buildId})}">
</head>
<body class="auth-page">
<main class="auth-layout">
    <section class="auth-card" aria-labelledby="reset-title">
        <div class="auth-brand">
            <span class="auth-brand-mark">FB</span>
            <div><strong>FlexBuddy</strong><small>Shift tracker</small></div>
        </div>

        <p class="eyebrow">RESET YOUR PASSWORD</p>
        <h1 id="reset-title">Choose a new password</h1>
        <p class="auth-copy">Use at least 8 characters. Saving it signs you out of every other device.</p>

        <form class="auth-form" th:action="@{/reset-password}" th:object="${reset}" method="post">
            <input type="hidden" th:field="*{token}">
            <label class="field">
                <span>New password</span>
                <input th:field="*{password}" type="password" autocomplete="new-password" minlength="8" maxlength="72" required autofocus>
                <small class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
            </label>
            <label class="field">
                <span>Confirm new password</span>
                <input th:field="*{confirmPassword}" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
                <small class="field-error" th:if="${#fields.hasErrors('matching')}" th:errors="*{matching}"></small>
            </label>
            <button class="primary-button auth-submit" type="submit">Save new password</button>
        </form>
    </section>
</main>
</body>
</html>
