<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#075c76">
    <title>Offline | FlexBuddy</title>
    <script>
        document.documentElement.dataset.theme =
            localStorage.getItem('flexbuddy-theme') === 'light' ? 'light' : 'dark';
    </script>
    <style>
        :root { color-scheme: dark; --page: #02080b; --surface: #202b31; --text: #f7f8f8; --muted: #aab4bb; --cyan: #08ace2; --ink: #073344; --line: #5c6870; }
        html[data-theme="light"] { color-scheme: light; --page: #ffffff; --surface: #f1f2f5; --text: #202a3c; --muted: #68717c; --cyan: #0789ad; --ink: #ffffff; --line: #c3cbd1; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; color: var(--text); background: var(--page); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
        main { width: min(420px, 100%); padding: 34px 28px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-top: 7px solid var(--cyan); border-radius: 10px; }
        .mark { width: 56px; height: 56px; margin: 0 auto 18px; display: grid; place-items: center; color: #073344; background: var(--cyan); border-radius: 50%; font-weight: 850; font-size: 20px; }
        h1 { margin: 0 0 10px; font-size: 28px; font-weight: 650; }
        p { margin: 0 0 24px; color: var(--muted); line-height: 1.55; }
        button { min-height: 50px; padding: 0 26px; color: var(--ink); background: var(--cyan); border: 0; border-radius: 6px; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <div class="mark" aria-hidden="true">FB</div>
    <h1>You're offline</h1>
    <p>FlexBuddy needs a connection to open this page for the first time. Your dashboard and schedule open offline once you have visited them online.</p>
    <button type="button" onclick="window.location.reload()">Retry</button>
</main>
</body>
</html>
