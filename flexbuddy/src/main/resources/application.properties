spring.application.name=flexbuddy
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flexbuddy}
spring.datasource.username=${DB_USER:flexbuddy}
spring.datasource.password=${DB_PASSWORD:flexbuddy}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
flexbuddy.mileage.default-rate=0.70
flexbuddy.mileage.default-rate-year=2025

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

flexbuddy.import.max-pixels=30000000

# Persistent sign-in tokens survive server restarts. Override this stable key in production.
flexbuddy.security.remember-me-key=${FLEXBUDDY_REMEMBER_ME_KEY:flexbuddy-development-key-change-in-production}

# Absolute links in calendar files use the https scheme Render's proxy reports.
server.forward-headers-strategy=framework
server.mime-mappings.webmanifest=application/manifest+json

# Replaced by Maven resource filtering so asset URLs and the service worker cache share one version.
flexbuddy.build-id=@buildId@

# Web Push stays off until both VAPID keys are set. Generate a pair once with: npx web-push generate-vapid-keys
flexbuddy.push.vapid-public-key=${FLEXBUDDY_VAPID_PUBLIC_KEY:}
flexbuddy.push.vapid-private-key=${FLEXBUDDY_VAPID_PRIVATE_KEY:}
flexbuddy.push.subject=${FLEXBUDDY_VAPID_SUBJECT:https://flexbuddy.onrender.com}
