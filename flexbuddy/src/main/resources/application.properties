spring.application.name=flexbuddy
server.port=${PORT:8080}
spring.mvc.hiddenmethod.filter.enabled=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flexbuddy}
spring.datasource.username=${DB_USER:flexbuddy}
spring.datasource.password=${DB_PASSWORD:flexbuddy}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
flexbuddy.mileage.default-rate=0.70
flexbuddy.mileage.default-rate-year=2025

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

flexbuddy.import.max-pixels=30000000
# Screenshot text extraction runs one at a time; a second upload waits this long before being told to try again.
flexbuddy.import.ocr-wait=20s

# Failed sign-ins lock an email, or a connection, for a while; sign-ups are limited per connection. Counts live in memory.
flexbuddy.security.login.max-failures-per-email=5
flexbuddy.security.login.max-failures-per-ip=20
flexbuddy.security.login.window=15m
flexbuddy.security.login.lock=15m
flexbuddy.security.registration.max-per-ip=10
flexbuddy.security.registration.window=1h

# Password-reset links: how many emails one address or connection can ask for, and how long a link works.
flexbuddy.security.reset.max-per-email=3
flexbuddy.security.reset.max-per-ip=10
flexbuddy.security.reset.window=1h
flexbuddy.security.reset.link-valid-for=30m

# Emailed codes (sign-up today, two-factor later): how long one works, wrong tries, and sends per address and connection.
flexbuddy.security.codes.valid-for=15m
flexbuddy.security.codes.max-attempts=5
flexbuddy.security.codes.max-sends-per-email=5
flexbuddy.security.codes.max-sends-per-ip=20
flexbuddy.security.codes.window=1h

# Email goes out through an SMTP server named only by environment variables, never by a value in this repository. With
# no host set the app still starts and logs that mail is not configured. Links are logged only with log-links=true,
# which is for local development: a production log must never hold a working link.
spring.mail.host=${FLEXBUDDY_MAIL_HOST:}
spring.mail.port=${FLEXBUDDY_MAIL_PORT:587}
spring.mail.username=${FLEXBUDDY_MAIL_USERNAME:}
spring.mail.password=${FLEXBUDDY_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
flexbuddy.mail.from=${FLEXBUDDY_MAIL_FROM:FlexBuddy <flexbuddysupport@gmail.com>}
flexbuddy.mail.log-links=false
flexbuddy.public-url=${FLEXBUDDY_PUBLIC_URL:https://flexbuddy.onrender.com}
# Mail is optional, so the health check Render polls never depends on the SMTP server.
management.health.mail.enabled=false

# Error alerts: the operator gets one email per distinct server or browser error, at most once every 6 hours and 20 a
# day. Reports carry class names and code locations, never exception messages or driver data.
flexbuddy.alerts.enabled=true
flexbuddy.alerts.to=${FLEXBUDDY_ALERT_TO:flexbuddysupport@gmail.com}
flexbuddy.alerts.quiet-period=6h
flexbuddy.alerts.max-per-day=20
flexbuddy.alerts.browser-reports-per-account-per-hour=10

# Encrypts authenticator-app secrets at rest. Set a long random value in production and never change it, or every
# driver using an authenticator app will need support to sign in.
flexbuddy.security.two-factor-key=${FLEXBUDDY_TWO_FACTOR_KEY:flexbuddy-development-two-factor-key}

# Google sign-in turns on only when both are set (Google Cloud console > APIs & Services > Credentials).
flexbuddy.google.client-id=${FLEXBUDDY_GOOGLE_CLIENT_ID:}
flexbuddy.google.client-secret=${FLEXBUDDY_GOOGLE_CLIENT_SECRET:}

# Persistent sign-in tokens survive server restarts. Override this stable key in production.
flexbuddy.security.remember-me-key=${FLEXBUDDY_REMEMBER_ME_KEY:flexbuddy-development-key-change-in-production}

# Absolute links in calendar files use the https scheme Render's proxy reports.
server.forward-headers-strategy=framework
server.mime-mappings.webmanifest=application/manifest+json

# Replaced by Maven resource filtering so asset URLs and the service worker cache share one version.
flexbuddy.build-id=@buildId@

# Web Push stays off until both VAPID keys are set. Generate a pair once with: npx web-push generate-vapid-keys
flexbuddy.push.vapid-public-key=${FLEXBUDDY_VAPID_PUBLIC_KEY:}
flexbuddy.push.vapid-private-key=${FLEXBUDDY_VAPID_PRIVATE_KEY:}
flexbuddy.push.subject=${FLEXBUDDY_VAPID_SUBJECT:https://flexbuddy.onrender.com}
