services:
  - type: web
    name: flexbuddy
    runtime: docker
    plan: starter
    region: ohio
    dockerfilePath: ./flexbuddy/Dockerfile
    dockerContext: ./flexbuddy
    healthCheckPath: /actuator/health
    # Deploy a main commit only after its GitHub checks (Java and JS tests) pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flexbuddy-postgres
          property: connectionString
      - key: DB_NAME
        fromDatabase:
          name: flexbuddy-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: flexbuddy-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: flexbuddy-postgres
          property: password
      - key: FLEXBUDDY_REMEMBER_ME_KEY
        generateValue: true
      # Encrypts authenticator-app secrets. Render generates it once and keeps it: never regenerate it, or every driver
      # using an authenticator app would lose access.
      - key: FLEXBUDDY_TWO_FACTOR_KEY
        generateValue: true
      # Render puts Cloudflare in front of the service, so the right-most X-Forwarded-For entry is a Cloudflare node
      # shared by many visitors. Cloudflare sets this header to the visitor's own address, and the sign-in, sign-up,
      # reset and email code limits are kept per address.
      - key: FLEXBUDDY_CLIENT_ADDRESS_HEADER
        value: CF-Connecting-IP
      # Password-reset email goes out through Gmail's SMTP server. The two secrets are asked for in Render's dashboard
      # and never stored in this file.
      - key: FLEXBUDDY_MAIL_HOST
        value: smtp.gmail.com
      - key: FLEXBUDDY_MAIL_PORT
        value: "587"
      # Google sign-in stays off until both are set (Google Cloud console > APIs & Services > Credentials).
      - key: FLEXBUDDY_GOOGLE_CLIENT_ID
        sync: false
      - key: FLEXBUDDY_GOOGLE_CLIENT_SECRET
        sync: false
      - key: FLEXBUDDY_MAIL_USERNAME
        sync: false
      - key: FLEXBUDDY_MAIL_PASSWORD
        sync: false

databases:
  - name: flexbuddy-postgres
    plan: basic-256mb
    region: ohio
    databaseName: flexbuddy
    user: flexbuddy
    postgresMajorVersion: "18"
    ipAllowList: []
